                            ${groupedTasks.oneTime && groupedTasks.oneTime.length > 0 ? `
                                <div class="border-t pt-4 mt-4">
                                    <div class="flex items-center gap-2 mb-2">
                                        ${getSectionIcon('oneTime')}
                                        <h3 class="font-semibold text-orange-700">${getSectionTitle('oneTime')}</h3>
                                        <span class="text-xs text-orange-500 bg-orange-50 px-2 py-0.5 rounded-full">Special tasks</span>
                                    </div>
                                    <div class="space-y-2">
                                        ${groupedTasks.oneTime.map(task => renderTaskItem(task, childKey)).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    ` : `
                        <p class="text-sm text-gray-500 italic text-center py-4">
                            View only - switch to this account to mark chores
                        </p>
                    `}
                </div>
            `;
        }

        function taskAppliesToDate(task, dateObj, childKey) {
            if (!task.days || task.days.length === 0) return false;
            const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const dayOfWeek = dateObj.getDay();
            const dayName = dayNames[dayOfWeek];
            const dateStr = dateObj.toDateString();
            const isToday = dateStr === new Date().toDateString();

            // One-time tasks only show on the day they were completed or today
            if (task.taskType === 'oneTime' || (task.days && task.days.includes('oneTime'))) {
                if (isToday) return true;
                if (childKey) {
                    const completed = state.completionHistory[childKey]?.[dateStr] || [];
                    const skipped = state.skippedHistory[childKey]?.[dateStr] || [];
                    return completed.includes(task.id) || skipped.includes(task.id);
                }
                return false;
            }

            // Flexible tasks apply to every day (can be done any day)
            if (task.taskType === 'flexible') return true;

            // Bonus-type tasks only show on the day they were completed or today
            if (task.taskType === 'bonus' || task.section === 'bonus') {
                if (isToday) return true;
                if (childKey) {
                    const completed = state.completionHistory[childKey]?.[dateStr] || [];
                    const skipped = state.skippedHistory[childKey]?.[dateStr] || [];
                    return completed.includes(task.id) || skipped.includes(task.id);
                }
                return false;
            }

            // Legacy: Weekly/monthly tasks show every day
            if (task.days.includes('weekly') || task.days.includes('monthly')) {
                return true;
            }

            return task.days.some(d => {
                if (d === dayName) return true;
                if (d === 'weekday' && dayOfWeek >= 1 && dayOfWeek <= 5) return true;
                return false;
            });
        }

        function renderWeeklyHistory() {
            if (!state.showHistory || !state.selectedHistoryChild) return '';

            const childKey = state.selectedHistoryChild;
            const todayStr = new Date().toDateString();
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Calculate the target week based on historyWeekOffset (0 = this week, -1 = last week, etc.)
            const offsetDate = new Date(today);
            offsetDate.setDate(offsetDate.getDate() + (state.historyWeekOffset * 7));
            const weekDates = getCalendarWeekDates(offsetDate);
            const isCurrentWeek = state.historyWeekOffset === 0;

            // For current week, only show days up to today
            const displayDates = isCurrentWeek
                ? weekDates.filter(d => new Date(d) <= today)
                : weekDates;

            const wStart = new Date(weekDates[0]);
            const wEnd = new Date(weekDates[6]);
            const weekLabel = wStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' - ' + wEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const weekBonusAwarded = state.weeklyBonusAwarded[childKey] && state.weeklyBonusAwarded[childKey][weekDates[0]];

            // Build week options for dropdown (current week + 8 prior weeks)
            const weekOptions = [];
            for (let i = 0; i >= -8; i--) {
                const optDate = new Date(today);
                optDate.setDate(optDate.getDate() + (i * 7));
                const optWeek = getCalendarWeekDates(optDate);
                const optStart = new Date(optWeek[0]);
                const optEnd = new Date(optWeek[6]);
                const optLabel = (i === 0 ? 'This Week: ' : '') +
                    optStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' - ' +
                    optEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                weekOptions.push({ value: i, label: optLabel });
            }

            return `
                <div class="space-y-6">
                    <!-- Week Navigation -->
                    <div class="flex items-center gap-2">
                        <button
                            onclick="state.historyWeekOffset--; render();"
                            class="px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition text-gray-700 font-bold"
                            title="Previous week"
                        >&larr;</button>
                        <select
                            onchange="state.historyWeekOffset = parseInt(this.value); render();"
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm"
                        >
                            ${weekOptions.map(opt => `
                                <option value="${opt.value}" ${opt.value === state.historyWeekOffset ? 'selected' : ''}>
                                    ${opt.label}
                                </option>
                            `).join('')}
                        </select>
                        <button
                            onclick="state.historyWeekOffset++; render();"
                            class="px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition text-gray-700 font-bold ${isCurrentWeek ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${isCurrentWeek ? 'disabled' : ''}
                            title="Next week"
                        >&rarr;</button>
                    </div>

                    <div class="border-2 ${isCurrentWeek ? 'border-blue-300' : 'border-gray-200'} rounded-xl overflow-hidden">
                        <div class="px-4 py-2 ${isCurrentWeek ? 'bg-blue-50' : 'bg-gray-50'} flex justify-between items-center">
                            <h3 class="font-bold text-sm ${isCurrentWeek ? 'text-blue-700' : 'text-gray-700'}">
                                ${isCurrentWeek ? 'This Week' : 'Week of'} ${weekLabel}
                            </h3>
                            <div class="flex items-center gap-2">
                                ${weekBonusAwarded ? '<span class="text-sm font-semibold text-orange-600">🎉 Weekly Bonus!</span>' : ''}
                            </div>
                        </div>
                        <div class="p-4 space-y-4">
                            ${displayDates.map(date => {
                                const dateObj = new Date(date);
                                const isToday = date === todayStr;
                                const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                                const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                                const completedForDay = isToday
                                    ? getTodayCompleted(childKey)
                                    : (state.completionHistory[childKey] && state.completionHistory[childKey][date] || []);
                                const skippedForDay = isToday
                                    ? getTodaySkipped(childKey)
                                    : (state.skippedHistory[childKey] && state.skippedHistory[childKey][date] || []);

                                const dayTasks = state.tasks.filter(t => taskAppliesToDate(t, dateObj, childKey));
                                const activeTasks = dayTasks.filter(t => !skippedForDay.includes(t.id));
                                const completedCount = completedForDay.filter(id => dayTasks.some(t => t.id === id)).length;
                                return `
                                    <div class="border border-gray-200 rounded-lg p-4">
                                        <div class="flex justify-between items-center mb-3">
                                            <h4 class="font-semibold text-gray-800">
                                                ${dayName}, ${dateStr} ${isToday ? '(Today)' : ''}
                                            </h4>
                                            <span class="text-sm text-gray-600">
                                                ${completedCount} / ${activeTasks.length} completed
                                            </span>
                                        </div>
                                        <div class="grid grid-cols-1 gap-2">
                                            ${dayTasks.map(task => {
                                                const isCompleted = completedForDay.includes(task.id);
                                                const isSkipped = skippedForDay.includes(task.id);

                                                return `
                                                    <div class="flex gap-2">
                                                        <button
                                                            onclick="${isToday
                                                                ? `toggleTaskSkipped('${childKey}', ${task.id})`
                                                                : `toggleHistorySkipped('${childKey}', '${date}', ${task.id})`}"
                                                            class="px-2 py-2 rounded border transition ${
                                                                isSkipped
                                                                    ? 'bg-gray-200 border-gray-400 text-gray-600'
                                                                    : 'bg-white border-gray-300 text-gray-400 hover:border-gray-400'
                                                            }"
                                                            title="${isSkipped ? 'Unskip' : 'Skip (N/A)'}"
                                                        >
                                                            ${isSkipped ? '↺' : '—'}
                                                        </button>
                                                        <button
                                                            onclick="${isSkipped ? '' : isToday
                                                                ? `toggleTaskComplete('${childKey}', ${task.id}, ${task.payout}, event)`
                                                                : `toggleHistoryTask('${childKey}', '${date}', ${task.id})`}"
                                                            ${isSkipped ? 'disabled' : ''}
                                                            class="flex-1 text-left p-2 rounded border transition ${
                                                                isSkipped
                                                                    ? 'bg-gray-100 border-gray-300 opacity-50 cursor-not-allowed'
                                                                    : isCompleted
                                                                    ? 'bg-green-50 border-green-300'
                                                                    : 'bg-gray-50 border-gray-200 hover:bg-gray-100'
                                                            }"
                                                        >
                                                            <div class="flex items-center gap-2">
                                                                <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center ${
                                                                    isSkipped
                                                                        ? 'bg-gray-300 border-gray-400'
                                                                        : isCompleted
                                                                        ? 'bg-green-500 border-green-500'
                                                                        : 'border-gray-300'
                                                                }">
                                                                    ${isSkipped ? `
                                                                        <span class="text-white text-xs">—</span>
                                                                    ` : isCompleted ? `
                                                                        <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                                                        </svg>
                                                                    ` : ''}
                                                                </div>
                                                                <span class="text-xs ${
                                                                    isSkipped
                                                                        ? 'text-gray-400 line-through'
                                                                        : isCompleted
                                                                        ? 'text-gray-600'
                                                                        : 'text-gray-700'
                                                                }">
                                                                    ${escapeHtml(task.name)}
                                                                </span>
                                                            </div>
                                                        </button>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

                                                <button
                                                    onclick="document.getElementById('importFile').click()"
                                                    class="w-full px-4 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition flex items-center justify-center gap-2 font-semibold"
                                                >
                                                    <span>📤</span>
                                                    Import Data
                                                </button>
                                            </div>
                                            <p class="text-xs text-gray-600 italic">
                                                💡 Export before updating to save your chores and settings. Import to restore from a backup.
                                            </p>
                                        </div>
                                    </div>
                                    
                                    <!-- Weekly Payout -->
                                    <div class="border-t border-gray-300 pt-4">
                                        <h4 class="font-semibold text-gray-700 mb-3">Weekly Payout</h4>
                                        ${['maria', 'helena'].map(childKey => `
                                            <div class="mb-2 p-3 bg-white rounded-lg border border-gray-200 flex items-center justify-between">
                                                <div>
                                                    <div class="font-medium text-gray-800">${escapeHtml(state.users[childKey].name)}</div>
                                                    <div class="text-sm text-gray-600">Weekly Earnings Total: $${state.earnings[childKey].weekTotal.toFixed(2)}</div>
                                                    <div class="text-xs text-blue-600">${new Date().getFullYear()} Total: $${getYearlyEarnings(childKey).toFixed(2)}</div>
                                                </div>
                                                <button
                                                    onclick="processWeeklyPayout('${childKey}')"
                                                    class="px-4 py-2 ${state.earnings[childKey].weekTotal > 0 ? 'bg-green-500 hover:bg-green-600' : 'bg-gray-300'} text-white rounded-lg text-sm font-semibold transition"
                                                    ${state.earnings[childKey].weekTotal === 0 ? 'disabled' : ''}
                                                >
                                                    💰 Pay Out
                                                </button>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Individual Child Trackers -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            ${renderChildTracker('maria', state.users.maria)}
                            ${renderChildTracker('helena', state.users.helena)}
                        </div>

                        <!-- Weekly History Section -->
                        ${state.currentUser.isParent ? `
                            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <div class="flex justify-between items-center mb-4">
                                    <h3 class="text-xl font-bold text-gray-800">Weekly History & Edit</h3>
                                    <button
                                        onclick="state.showHistory = !state.showHistory; render();"
                                        class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition"
                                    >
                                        ${state.showHistory ? 'Hide History' : 'Show History'}
                                    </button>
                                </div>

                                ${state.showHistory ? `
                                    <div class="space-y-6">
                                        <!-- Child Selector -->
                                        <div class="flex gap-4">
                                            <button
                                                onclick="state.selectedHistoryChild = 'maria'; state.historyWeekOffset = 0; render();"
                                                class="flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                                                    state.selectedHistoryChild === 'maria'
                                                        ? 'bg-green-500 text-white'
                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                }"
                                            >
                                                Maria
                                            </button>
                                            <button
                                                onclick="state.selectedHistoryChild = 'helena'; state.historyWeekOffset = 0; render();"
                                                class="flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                                                    state.selectedHistoryChild === 'helena'
                                                        ? 'bg-green-500 text-white'
                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                }"
                                            >
                                                Helena
                                            </button>
                                        </div>

                                        ${state.selectedHistoryChild ? renderWeeklyHistory() : `
                                            <p class="text-center text-gray-500 py-8">
                                                Select Maria or Helena to view their weekly history
                                            </p>
                                        `}
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}

                        <!-- Task Management -->
                        ${state.currentUser.isParent ? renderTaskManagement() : ''}
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = state.currentUser ? renderMainApp() : renderLoginScreen();
        }

        // Initialize
        loadState();
        checkDailyReset(); // Clear stale completions from localStorage before any render
        render();

        // Boot sequence: anonymous auth → Firebase listeners
        auth.signInAnonymously().then(() => {
            console.log('Auth ready, uid:', auth.currentUser.uid);
            setupRealtimeSync();
            syncFromReward();
        }).catch(err => {
            console.warn('Auth/boot error, loading with cache:', err);
            setupRealtimeSync();
            syncFromReward();
        });

        // Check for daily reset every minute (only after Firebase has loaded to avoid stale data)
        setInterval(() => {
            if (firebaseLoaded) {
                checkDailyReset();
                render();
            }
        }, 60000);

        // iPad/Safari fix: when a backgrounded tab becomes visible again, its in-memory
        // state.lastModified can be newer than Firebase (e.g., from an earlier local edit)
        // even though *another* device has since pushed real changes. The normal listener's
        // timestamp-wins logic would then push the stale local state OVER fresh remote data.
        // On visibility regain, force-pull Firebase and accept it unconditionally, treating
        // it like a fresh page load.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            if (!firebaseLoaded) return; // initial sync hasn't happened yet — listener will handle it
            database.ref('allowanceData').once('value').then((snapshot) => {
                if (!snapshot.exists()) return;
                const firebaseData = snapshot.val();
                const currentJson = JSON.stringify(stripTransientFields(state));
                const newJson = JSON.stringify(firebaseData);
                if (currentJson === newJson) return;
                console.log('Tab regained visibility — accepting Firebase data unconditionally to avoid stale-overwrite');
                const currentUser = state.currentUser;
                Object.assign(state, firebaseData);
                state.currentUser = currentUser;
                state.loginForm = { username: '', password: '' };
                sanitizeState();
                checkDailyReset();
                cleanupInvalidCompletions();
                silentRecalculateEarnings();
                try { localStorage.setItem('moneyTrackerState', JSON.stringify(stripTransientFields(state))); } catch (e) {}
                lastSyncTime = new Date();
                syncStatus = 'connected';
                render();
            }).catch(err => console.warn('visibilitychange refetch failed:', err));
        });
    </script>
</body>
</html>
