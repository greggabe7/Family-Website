<!DOCTYPE html>
<html><head><title>Firebase Debug</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body style="font-family:monospace;padding:20px;background:#111;color:#0f0;">
<h2>Firebase Debug</h2>
<pre id="out">Loading...</pre>
<script>
const el = document.getElementById('out');
function log(msg) { el.textContent += msg + '\n'; }
try {
    const app = firebase.initializeApp({
        apiKey: "AIzaSyARiateAk1EJggk09iMDdCvNZDPDNcu7EU",
        authDomain: "gabriel-family-allowance.firebaseapp.com",
        databaseURL: "https://gabriel-family-allowance-default-rtdb.firebaseio.com",
        projectId: "gabriel-family-allowance",
        storageBucket: "gabriel-family-allowance.firebasestorage.app",
        messagingSenderId: "351490113717",
        appId: "1:351490113717:web:6e5a3e96b8e36e84e49486"
    });
    const db = firebase.database();
    log('Firebase initialized OK');

    // Check all possible image paths
    const paths = ['landingPage/images', 'landingPage', 'hubPage/images', 'images'];
    paths.forEach(path => {
        db.ref(path).once('value').then(snap => {
            const data = snap.val();
            if (data) {
                log('\n=== ' + path + ' ===');
                if (typeof data === 'object') {
                    Object.keys(data).forEach(k => {
                        const val = typeof data[k] === 'string' ? data[k].substring(0, 80) + '...' : JSON.stringify(data[k]).substring(0, 80);
                        log('  ' + k + ': ' + val);
                    });
                } else {
                    log('  ' + JSON.stringify(data).substring(0, 200));
                }
            } else {
                log(path + ': NULL (no data)');
            }
        }).catch(err => {
            log(path + ': ERROR - ' + err.message);
        });
    });

    // Also check root keys
    db.ref('/').once('value').then(snap => {
        const data = snap.val();
        if (data) {
            log('\n=== ROOT KEYS ===');
            Object.keys(data).forEach(k => log('  ' + k));
        }
    }).catch(err => {
        log('ROOT: ERROR - ' + err.message);
    });
} catch(err) {
    log('INIT ERROR: ' + err.message);
}
</script>
</body></html>
